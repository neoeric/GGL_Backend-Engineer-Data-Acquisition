[build-system]
requires = ["setuptools>=65", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-agent-assignment"
version = "0.1.0"
description = "Bounded anonymous Threads acquisition CLI"
requires-python = ">=3.11"
dependencies = ["playwright==1.59.0", "httpx==0.28.1"]

[project.scripts]
threads-agent = "threads_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

